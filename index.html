<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Weekly Question</title>
</head>

<body>

    <button id="themeButton">Night Mode</button>
    <h2>
        The Question of This Week<br>
        이번 주의 질문
    </h2>

    <p id="question_en"></p>
    <p id="question_ko"></p>
    <p>You don't like the question? </p>
    <button id="refreshQuestion">
        Get new question
    </button><br><br>

    <textarea
        id="respondent"
        rows="1"
        cols="50"
        placeholder="여기에 누군지 적으세요 (Write who you are here)"></textarea>

    <br>

    <textarea
        id="answer"
        rows="10"
        cols="50"
        placeholder="여기에 답변을 적어주세요 (Write your answer here)"></textarea>

    <br>

    <button id="submitButton">Submit</button>
    <br>
    <p id="message"></p>
    <p id="message_ko"></p>
    <p id="message2"></p>

<!-- ------------ javascript code ------------ -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = "https://uraebkvvqodlckqjxity.supabase.co";
    const SUPABASE_KEY = "sb_publishable_pZVfjCg4yC7kmB9CzFilVQ_2Kt7gSpt";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const startDate = new Date("2026-09-08");
    const today = new Date();

    const difference = today - startDate;
    const daysPassed = Math.floor(difference / (1000 * 60 * 60 * 24));

    const weekNumber = Math.floor(daysPassed / 7) + 1;

    async function loadQuestion() {
        const { data: questionData, error: questionError } = await db
            .from("questions")
            .select("question_en, question_ko")
            .eq("week_number", weekNumber)
            .order("created_at", { ascending: false })
            .limit(1)
            .single();

        if (questionError) {
            console.error("Question error:", questionError);
        } else {
            document.getElementById("question_en").textContent =
                questionData.question_en;
            document.getElementById("question_ko").textContent =
                questionData.question_ko;
        }
    }

    loadQuestion();

    // clicked when the answer is submitted
    const submit_button = document.getElementById("submitButton");
    // control theme mode
    const themeButton = document.getElementById("themeButton");
    // generate a new question
    const refreshQuestion = document.getElementById("refreshQuestion");

    themeButton.addEventListener("click", function () {
        document.body.classList.toggle("dark-mode");
    });

    refreshQuestion.addEventListener("click", async function() {
        const { data, error } = await db.functions.invoke("generate-question", {
            body: {}
        });

        if (error) {
            console.error("Generate question error:", error);
            return;
        }

        console.log("Generated question:", data);
    });

    submit_button.addEventListener("click", async function() {
        const answer = document.getElementById("answer").value;
        const respondent = document.getElementById("respondent").value;

        if (answer.trim() === "" || respondent.trim() === "") {
            document.getElementById("message").textContent = "Please write your answer/name.";
        } 

        else{
            const { error } = await db
            .from("responses")
            .insert({
                question: question_en.value,
                answer: answer,
                respondent: respondent,
                week_number: 1
            });

            if (error) {
                console.error("Supabase error:", error);
                document.getElementById("message").textContent =
                    "Something went wrong while submitting your answer.";
            }

            else {
                document.getElementById("message").textContent = "Submitted succesfully! ";
                document.getElementById("message_ko").textContent = "성공적으로 제출되었습니다! ";
                document.getElementById("answer").value = "";
                document.getElementById("respondent").value = "";
            }
        }
        
    });
</script>
<!-- ------------------------------------------ -->
</body>

</html>
