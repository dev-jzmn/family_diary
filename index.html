<!DOCTYPE html>
<html>

<head>
    <title>Draft Page</title>
</head>

<body>

    <h2>
        이번 주의 질문<br>
        The Question of This Week
    </h2>

    <p id="question">
        <!-- 학창 시절 가장 기억에 남는 일탈이나 추억은 무엇인가요?<br>
        What are your best memories from your school days? -->
    </p>

    <textarea
        id="respondent"
        rows="1"
        cols="50"
        placeholder="여기에 누군지 적으세요 (Write who you are here)"></textarea>

    <br>

    <textarea
        id="answer"
        rows="10"
        cols="50"
        placeholder="여기에 답변을 적어주세요 (Write your answer here)"></textarea>

    <br>

    <button id="submitButton">Submit</button>
    <br>
    <p id="message"></p><br>
    <p id="message2"></p>

<!-- ------------ javascript code ------------ -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = "https://uraebkvvqodlckqjxity.supabase.co";
    const SUPABASE_KEY = "sb_publishable_pZVfjCg4yC7kmB9CzFilVQ_2Kt7gSpt";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const startDate = new Date("2026-09-08");
    const today = new Date();

    const difference = today - startDate;
    const daysPassed = Math.floor(difference / (1000 * 60 * 60 * 24));

    const weekNumber = Math.floor(daysPassed / 7) + 1;

    async function loadQuestion() {
        const { data: questionData, error: questionError } = await db
            .from("questions")
            .select("question_text")
            .eq("week_number", weekNumber)
            .order("created_at", { ascending: false })
            .limit(1)
            .single();

        if (questionError) {
            console.error("Question error:", questionError);
        } else {
            document.getElementById("question").textContent =
                questionData.question_text;
        }
    }

    loadQuestion();

    const button = document.getElementById("submitButton");

    button.addEventListener("click", async function() {
        const answer = document.getElementById("answer").value;
        const respondent = document.getElementById("respondent").value;

        if (answer.trim() === "") {
            document.getElementById("message").textContent = "Please write your answer.";
        } 

        if (respondent.trim() === "") {
            document.getElementById("message2").textContent = "Please write who you are.";
        }

        const { error } = await db
        .from("responses")
        .insert({
            question: "학창 시절 가장 기억에 남는 일탈이나 추억은 무엇인가요?",
            answer: answer,
            respondent: respondent,
            week_number: 1
        });

        if (error) {
            console.error("Supabase error:", error);
            document.getElementById("message").textContent =
                "Something went wrong while submitting your answer.";
        }

        else {
            document.getElementById("message").textContent = "Submitted succesfully!";
            document.getElementById("answer").value = "";
            document.getElementById("respondent").value = "";
        }

    });
</script>
<!-- ------------------------------------------ -->
</body>

</html>
