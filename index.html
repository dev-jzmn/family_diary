<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Weekly Question</title>
</head>

<body>

    <button id="themeButton">Night Mode</button>
    <a id="why_this_project" href="about.html">Why did I make this website?</a>
    <h2>
        The Question of This Week<br>
        이번 주의 질문
    </h2>

    <p id="question_en"></p>
    <p id="question_ko"></p>
    <p>You don't like the question? Get a new quetion. It may take up to 15 seconds.
        <br>Note: The next person will see the refreshed question. 
    </p>
    <button id="refreshQuestion">
        Get a new question
    </button><br><br>

    <input type="file" id="photoInput" accept="image/*">
    <br><br>

    <textarea
        id="respondent"
        rows="1"
        cols="50"
        placeholder="여기에 누군지 적으세요 (Write who you are here)"></textarea>

    <br>

    <textarea
        id="answer"
        rows="10"
        cols="50"
        placeholder="여기에 답변을 적어주세요 (Write your answer here)"></textarea>

    <br>

    <button id="submitButton">Submit</button>
    <br>
    <p id="message"></p>
    <p id="message_ko"></p>
    <p id="message2"></p>

<!-- ------------ javascript code ------------ -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
<script>
    const SUPABASE_URL = "https://uraebkvvqodlckqjxity.supabase.co";
    const SUPABASE_KEY = "sb_publishable_pZVfjCg4yC7kmB9CzFilVQ_2Kt7gSpt";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function getWeekNumber() {
        const start = new Date("2026-09-07T00:00:00-07:00");
        const now = new Date();

        const diff = now.getTime() - start.getTime();

        return Math.floor(
            diff / (1000 * 60 * 60 * 24 * 7)
        ) + 1;
    }

    const weekNumber = getWeekNumber();

    let question_id = null;

    async function loadQuestion() {
        const { data: questionData, error: questionError } = await db
        .from("questions")
        .select("id, question_en, question_ko")
        .eq("week_number", weekNumber)
        .order("created_at", { ascending: false })
        .limit(1)
        .single();

        if (questionError) {
            console.error("Question error:", questionError);
        } else {
            document.getElementById("question_en").textContent =
                questionData.question_en;
            document.getElementById("question_ko").textContent =
                questionData.question_ko;
        }

        question_id = questionData.id;
    }
    


    loadQuestion();

    // clicked when the answer is submitted
    const submit_button = document.getElementById("submitButton");
    // generate a new question
    const refreshQuestion = document.getElementById("refreshQuestion");

    if (localStorage.getItem("theme") === "dark") {
        document.body.classList.add("dark-mode");
    }

    // set the theme according to the current page theme. 
    // this is consistent even if the user refresh the page.
    if (localStorage.getItem("theme") === "dark") {
        document.getElementById("themeButton").textContent = "Day Theme";
    } else {
        document.getElementById("themeButton").textContent = "Night Theme";
    }

    refreshQuestion.addEventListener("click", async function() {
        refreshQuestion.textContent = "Generating a new question ...";
        const { data, error } = await db.functions.invoke("generate-question", {
            body: {
                weekNumber : weekNumber
            }
        });

        if (error) {
            console.error("Generate question error:", error);
            refreshQuestion.textContent = "Try again";
            return;
        }

        document.getElementById("question_en").textContent =
            data.question_en;

        document.getElementById("question_ko").textContent =
            data.question_ko;
        refreshQuestion.textContent = "Get a new question";
    });


    // submitting
    submit_button.addEventListener("click", async function() {
        // photo uploading 
        const photoInput = document.getElementById("photoInput");
        const file = photoInput.files[0];

        let photoPath = null;

        if (file) {
            const filePath =
                `${weekNumber}/${Date.now()}-${file.name}`;

            const { data: uploadData, error: uploadError } =
                await db.storage
                    .from("family_photos")
                    .upload(filePath, file);

            if (uploadError) {
                console.error("Photo upload error:", uploadError);
                return;
            }

            photoPath = uploadData.path;
        }

        const answer = document.getElementById("answer").value;
        const respondent = document.getElementById("respondent").value;

        if (answer.trim() === "" || respondent.trim() === "") {
            document.getElementById("message").textContent = "Please write your answer/name.";
        } 

        else{
            const currentQuestionId = question_id;
            const currentQuestion = document.getElementById("question_en").textContent;
            const { error } = await db
            .from("responses")
            .insert({
                question_id: currentQuestionId,
                answer: answer,
                respondent: respondent,
                week_number: weekNumber,
                photo_path: photoPath
            });

            if (error) {
                console.error("Supabase error:", error);
                document.getElementById("message").textContent =
                    "Something went wrong while submitting your answer.";
            }

            else {
                document.getElementById("message").textContent = "Submitted succesfully! ";
                document.getElementById("message_ko").textContent = "성공적으로 제출되었습니다! ";
                document.getElementById("photoInput").value = "";
                document.getElementById("answer").value = "";
                document.getElementById("respondent").value = "";
            }
        }
        
    });
</script>
<!-- ------------------------------------------ -->
</body>

</html>
